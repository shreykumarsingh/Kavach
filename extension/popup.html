<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naari Kavach Scanner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 400px;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      color: #1e293b;
    }

    .container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 24px;
      height: 24px;
      color: white;
    }

    .header-text h1 {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }

    .header-text p {
      font-size: 11px;
      color: #64748b;
    }

    .status-bar {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 13px;
      color: #475569;
    }

    .action-section {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .action-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1e293b;
    }

    .btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .preview-section {
      display: none;
      margin-bottom: 16px;
    }

    .preview-section.active {
      display: block;
    }

    .preview-image {
      width: 100%;
      border-radius: 12px;
      max-height: 180px;
      object-fit: contain;
      background: #f1f5f9;
      border: 2px dashed #cbd5e1;
    }

    .result-section {
      display: none;
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .result-section.active {
      display: block;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .result-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-icon.safe {
      background: #dcfce7;
    }

    .result-icon.warning {
      background: #fef3c7;
    }

    .result-icon.danger {
      background: #fee2e2;
    }

    .result-icon svg {
      width: 24px;
      height: 24px;
    }

    .result-icon.safe svg {
      color: #22c55e;
    }

    .result-icon.warning svg {
      color: #f59e0b;
    }

    .result-icon.danger svg {
      color: #ef4444;
    }

    .result-title {
      font-size: 16px;
      font-weight: 600;
    }

    .result-subtitle {
      font-size: 12px;
      color: #64748b;
    }

    .score-bar {
      background: #f1f5f9;
      border-radius: 8px;
      height: 24px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .score-fill {
      height: 100%;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      font-size: 12px;
      font-weight: 600;
      color: white;
      transition: width 1s ease;
    }

    .score-fill.safe {
      background: linear-gradient(90deg, #22c55e, #16a34a);
    }

    .score-fill.warning {
      background: linear-gradient(90deg, #f59e0b, #d97706);
    }

    .score-fill.danger {
      background: linear-gradient(90deg, #ef4444, #dc2626);
    }

    .score-label {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }

    .result-details {
      font-size: 12px;
      color: #64748b;
      line-height: 1.6;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .loading.active {
      display: block;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #f1f5f9;
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 13px;
      color: #64748b;
    }

    .footer {
      text-align: center;
      padding-top: 12px;
      border-top: 1px solid #e2e8f0;
    }

    .footer a {
      font-size: 12px;
      color: #8b5cf6;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Naari Kavach Scanner</h1>
        <p>AI-Powered Deepfake Detection</p>
      </div>
    </div>

    <div class="status-bar">
      <div class="status-item">
        <div class="status-dot"></div>
        <span class="status-text">Ready to scan images on this page</span>
      </div>
    </div>

    <div class="action-section">
      <div class="action-title">Quick Actions</div>
      <button id="captureBtn" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>Capture & Analyze Image</span>
      </button>
      <button id="selectBtn" class="btn btn-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h6"/>
          <path d="m12 12 4 10 1.7-4.3L22 16Z"/>
        </svg>
        <span>Select Specific Image</span>
      </button>
    </div>

    <div id="previewSection" class="preview-section">
      <img id="previewImage" class="preview-image" alt="Captured image">
    </div>

    <div id="loadingSection" class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Analyzing image...</div>
    </div>

    <div id="resultSection" class="result-section">
      <div class="result-header">
        <div id="resultIcon" class="result-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
        <div>
          <div id="resultTitle" class="result-title">Analysis Result</div>
          <div id="resultSubtitle" class="result-subtitle">Deepfake Detection</div>
        </div>
      </div>
      <div class="score-label">Authenticity Score</div>
      <div class="score-bar">
        <div id="scoreFill" class="score-fill safe" style="width: 85%">85%</div>
      </div>
      <div id="resultDetails" class="result-details">
        This image appears to be authentic with no signs of manipulation detected.
      </div>
    </div>

    <div class="footer">
      <a href="#" id="openDashboard">Open Naari Kavach Dashboard</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
